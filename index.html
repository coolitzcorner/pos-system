<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>🍽️ BitePOS · Food Business</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { background: #f4f7fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .pos-container { max-width: 1400px; width: 100%; background: white; border-radius: 40px; box-shadow: 0 25px 50px -10px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; }
    .pos-header { background: #1e293b; color: white; padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .pos-header h1 { font-weight: 600; font-size: 1.8rem; display: flex; align-items: center; gap: 12px; }
    .pos-header h1 i { color: #facc15; }
    .pos-header .order-stats { background: #334155; padding: 10px 22px; border-radius: 50px; font-size: 0.95rem; display: flex; align-items: center; gap: 25px; }
    .pos-header .order-stats span { display: flex; align-items: center; gap: 8px; }
    .pos-header .order-stats i { color: #94a3b8; }
    .badge-count { background: #facc15; color: #0f172a; font-weight: 700; padding: 0 10px; border-radius: 30px; font-size: 0.85rem; line-height: 22px; }
    .pos-grid { display: grid; grid-template-columns: 1fr 380px; gap: 0; background: #f8fafc; }
    @media (max-width: 960px) { .pos-grid { grid-template-columns: 1fr; } }
    .menu-panel { padding: 24px 24px 30px; background: white; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .panel-header h2 { font-size: 1.1rem; color: #1e293b; }
    .btn-inventory { background: #e9edf2; border: none; padding: 8px 16px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-inventory:hover { background: #d6dce4; }
    .category-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #e9edf2; padding-bottom: 16px; }
    .category-btn { background: transparent; border: none; padding: 10px 18px; border-radius: 40px; font-weight: 600; font-size: 0.9rem; color: #475569; transition: 0.2s; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .category-btn i { font-size: 1rem; }
    .category-btn.active { background: #1e293b; color: white; }
    .category-btn:hover:not(.active) { background: #eef2f6; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .menu-item { background: #ffffff; border: 1px solid #eef2f6; border-radius: 24px; padding: 18px 12px 14px; text-align: center; transition: 0.2s ease; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.02); position: relative; }
    .menu-item:hover:not(.out-of-stock) { transform: translateY(-3px); border-color: #cbd5e1; box-shadow: 0 12px 20px -12px rgba(0,0,0,0.15); }
    .menu-item.out-of-stock { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.3); }
    .menu-item .stock-badge { position: absolute; top: 8px; right: 8px; background: #1e293b; color: white; font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .menu-item .stock-badge.low { background: #dc2626; animation: pulse 1s infinite; }
    .menu-item .stock-badge.medium { background: #f59e0b; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .menu-item .emoji-big { font-size: 2.8rem; display: block; margin-bottom: 6px; }
    .menu-item .item-name { font-weight: 600; font-size: 0.95rem; color: #0f172a; margin: 6px 0 2px; }
    .menu-item .item-price { font-weight: 700; color: #0f172a; background: #f1f5f9; display: inline-block; padding: 2px 14px; border-radius: 30px; font-size: 0.9rem; margin-top: 6px; }
    .menu-item .item-category-badge { font-size: 0.65rem; text-transform: uppercase; background: #e9edf2; padding: 2px 10px; border-radius: 30px; color: #475569; display: inline-block; margin-top: 4px; }
    .cart-panel { background: #f8fafc; border-left: 1px solid #e2e8f0; padding: 24px 18px 20px; display: flex; flex-direction: column; height: 100%; min-height: 600px; }
    .cart-panel h2 { font-size: 1.3rem; display: flex; justify-content: space-between; color: #1e293b; font-weight: 600; margin-bottom: 20px; align-items: center; }
    .cart-panel h2 i { color: #64748b; }
    .cart-list { flex: 1; overflow-y: auto; padding-right: 4px; margin-bottom: 16px; max-height: 400px; }
    .cart-item { background: white; border-radius: 20px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #eef2f6; }
    .cart-item-left { display: flex; flex-direction: column; gap: 4px; }
    .cart-item-name { font-weight: 600; color: #0f172a; }
    .cart-item-meta { font-size: 0.8rem; color: #64748b; display: flex; gap: 10px; align-items: center; }
    .cart-item-actions { display: flex; align-items: center; gap: 12px; }
    .qty-btn { background: #f1f5f9; border: none; width: 28px; height: 28px; border-radius: 30px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.15s; color: #1e293b; display: inline-flex; justify-content: center; align-items: center; }
    .qty-btn:hover { background: #e2e8f0; }
    .qty-num { font-weight: 600; min-width: 24px; text-align: center; }
    .remove-item { color: #94a3b8; background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 0 4px; transition: 0.2s; }
    .remove-item:hover { color: #dc2626; }
    .cart-total { background: white; border-radius: 28px; padding: 18px 20px; margin-top: 8px; border: 1px solid #e2e8f0; }
    .total-row { display: flex; justify-content: space-between; font-weight: 600; font-size: 1.3rem; color: #0f172a; }
    .total-row small { font-weight: 400; font-size: 0.85rem; color: #475569; }
    .cart-actions { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
    .btn-primary, .btn-secondary, .btn-danger { flex: 1; padding: 16px 12px; border: none; border-radius: 60px; font-weight: 700; font-size: 1rem; display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; min-width: 100px; }
    .btn-primary { background: #1e293b; color: white; }
    .btn-primary:hover { background: #0f172a; transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #e9edf2; color: #1e293b; }
    .btn-secondary:hover { background: #d6dce4; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-danger:hover { background: #fecaca; }
    .payment-method { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
    .payment-method button { background: #f1f5f9; border: 1px solid transparent; padding: 6px 14px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; color: #334155; cursor: pointer; transition: 0.1s; }
    .payment-method button.active-method { background: #1e293b; color: white; border-color: #1e293b; }
    .empty-cart-msg { text-align: center; color: #94a3b8; padding: 50px 10px; font-style: italic; }
    .toast-message { background: #1e293b; color: white; padding: 12px 25px; border-radius: 60px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: 500; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast-message.show { opacity: 1; }
    .footer-note { padding: 12px 28px; background: #f1f5f9; color: #475569; font-size: 0.8rem; display: flex; justify-content: space-between; border-top: 1px solid #e2e8f0; }
    .saving-spinner { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 30px; padding: 30px; max-width: 800px; width: 95%; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e9edf2; }
    .modal-header h2 { font-size: 1.4rem; color: #1e293b; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #94a3b8; padding: 0 10px; }
    .modal-close:hover { color: #1e293b; }
    .inventory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .inventory-grid { grid-template-columns: 1fr; } }
    .inventory-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f8fafc; border-radius: 16px; border: 1px solid #eef2f6; }
    .inventory-item .item-info { display: flex; align-items: center; gap: 10px; flex: 1; }
    .inventory-item .item-info .emoji { font-size: 1.5rem; }
    .inventory-item .item-info .name { font-weight: 600; font-size: 0.85rem; }
    .inventory-item .stock-control { display: flex; align-items: center; gap: 8px; }
    .inventory-item .stock-control input { width: 60px; padding: 4px 8px; border: 1px solid #d6dce4; border-radius: 8px; text-align: center; font-weight: 600; }
    .inventory-item .stock-control input:focus { outline: 2px solid #1e293b; }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .btn-update-stock, .btn-reset-stock { flex: 1; padding: 12px 24px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; }
    .btn-update-stock { background: #1e293b; color: white; }
    .btn-update-stock:hover { background: #0f172a; }
    .btn-reset-stock { background: #fee2e2; color: #b91c1c; }
    .btn-reset-stock:hover { background: #fecaca; }
  </style>
</head>
<body>
<div class="pos-container">
  <header class="pos-header">
    <h1><i class="fas fa-utensils"></i> BitePOS</h1>
    <div class="order-stats">
      <span><i class="fas fa-shopping-bag"></i> Items <span class="badge-count" id="cartCountHeader">0</span></span>
      <span><i class="fas fa-coins"></i> Total <span id="totalHeader">₱0.00</span></span>
    </div>
  </header>

  <div class="pos-grid">
    <div class="menu-panel">
      <div class="panel-header">
        <h2><i class="fas fa-utensils"></i> Menu</h2>
        <button class="btn-inventory" id="inventoryBtn"><i class="fas fa-boxes"></i> Manage Stock</button>
      </div>
      <div class="category-tabs" id="categoryTabs">
        <button class="category-btn active" data-category="all"><i class="fas fa-th"></i> All</button>
        <button class="category-btn" data-category="silog"><i class="fas fa-egg"></i> Silog</button>
        <button class="category-btn" data-category="hotdog"><i class="fas fa-hotdog"></i> Hotdog</button>
        <button class="category-btn" data-category="burger"><i class="fas fa-hamburger"></i> Burgers</button>
        <button class="category-btn" data-category="noodles"><i class="fas fa-utensil-spoon"></i> Noodles</button>
        <button class="category-btn" data-category="addons"><i class="fas fa-plus-circle"></i> Add-ons</button>
        <button class="category-btn" data-category="drinks"><i class="fas fa-glass-martini-alt"></i> Drinks</button>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div class="cart-panel">
      <h2><span><i class="fas fa-shopping-cart"></i> Order</span> <span id="cartItemCount">0</span></h2>
      <div class="cart-list" id="cartList">
        <div class="empty-cart-msg"><i class="fas fa-egg" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i> Your cart is empty<br><span style="font-size:0.8rem;">Add items from the menu</span></div>
      </div>

      <div class="cart-total">
        <div class="total-row">
          <span>Total</span>
          <span id="cartTotalAmount">₱0.00</span>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap;">
          <div class="payment-method" id="paymentMethod">
            <button class="active-method" data-method="cash"><i class="fas fa-money-bill-wave"></i> Cash</button>
            <button data-method="card"><i class="fas fa-credit-card"></i> Card</button>
            <button data-method="gcash"><i class="fas fa-mobile-alt"></i> GCash</button>
          </div>
        </div>
      </div>

      <div class="cart-actions">
        <button class="btn-primary" id="checkoutBtn"><i class="fas fa-check-circle"></i> Checkout</button>
        <button class="btn-secondary" id="clearCartBtn"><i class="fas fa-trash-alt"></i> Clear</button>
      </div>
      <div style="margin-top: 8px; display: flex; gap: 8px;">
        <button class="btn-danger" id="sampleOrderBtn" style="flex:1; padding: 10px;"><i class="fas fa-plus-circle"></i> Sample order</button>
      </div>
    </div>
  </div>
  <div class="footer-note">
    <span><i class="fas fa-store-alt"></i> BitePOS · Food Business</span>
    <span id="orderCountDisplay">Orders today: 0</span>
  </div>
</div>

<div class="modal-overlay" id="inventoryModal">
  <div class="modal">
    <div class="modal-header">
      <h2><i class="fas fa-boxes"></i> Inventory Management</h2>
      <button class="modal-close" id="closeModal">&times;</button>
    </div>
    <div style="margin-bottom: 16px; color: #64748b; font-size: 0.9rem;">
      <i class="fas fa-info-circle"></i> Set your current stock quantities below. Stock will auto-deduct when orders are placed.
    </div>
    <div class="inventory-grid" id="inventoryGrid"></div>
    <div class="modal-actions">
      <button class="btn-update-stock" id="updateStockBtn"><i class="fas fa-save"></i> Update Stock</button>
      <button class="btn-reset-stock" id="resetStockBtn"><i class="fas fa-undo"></i> Reset to Default</button>
    </div>
  </div>
</div>

<div id="toast" class="toast-message"><i class="fas fa-bell"></i> <span id="toastText">Ready</span></div>

<script>
(function(){
  "use strict";

  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwZZDPfgtxL3-5rL6GAxg7Kp0zgTP68oohfvwvW1z5KHUEOelFPkcVAPUJ4URCjmcQN/exec';

  const DEFAULT_STOCK = {
    1: 50, 2: 50, 3: 50, 4: 50, 5: 50, 6: 50, 7: 50,
    8: 100, 9: 100, 10: 100, 11: 100,
    12: 80, 13: 80, 14: 80,
    15: 60, 16: 40, 17: 40,
    18: 200, 19: 200, 20: 150, 21: 200,
    22: 120, 23: 200, 24: 120, 25: 120
  };

  const menuItems = [
    { id: 1, name: "Bacsilog", price: 90, category: "silog", emoji: "🥓🍚" },
    { id: 2, name: "Hotsilog", price: 75, category: "silog", emoji: "🌭🍚" },
    { id: 3, name: "Cornsilog", price: 75, category: "silog", emoji: "🌽🍚" },
    { id: 4, name: "Hungsilog", price: 100, category: "silog", emoji: "🌭🍚" },
    { id: 5, name: "Hamsilog", price: 70, category: "silog", emoji: "🍖🍚" },
    { id: 6, name: "Tocilog", price: 90, category: "silog", emoji: "🥩🍚" },
    { id: 7, name: "Tapsilog", price: 100, category: "silog", emoji: "🥩🍚" },
    { id: 8, name: "Hotdog on Stick", price: 28, category: "hotdog", emoji: "🌭" },
    { id: 9, name: "Hotdog on Bun", price: 38, category: "hotdog", emoji: "🌭" },
    { id: 10, name: "Hungarian on Stick", price: 38, category: "hotdog", emoji: "🌭" },
    { id: 11, name: "Hungarian on Bun", price: 45, category: "hotdog", emoji: "🌭" },
    { id: 12, name: "B1T1 Burger", price: 55, category: "burger", emoji: "🍔" },
    { id: 13, name: "B1T1 Chicken Burger", price: 60, category: "burger", emoji: "🍔🐔" },
    { id: 14, name: "B1T1 Bacon Burger", price: 120, category: "burger", emoji: "🥓🍔" },
    { id: 15, name: "Pancit Canton", price: 30, category: "noodles", emoji: "🍜" },
    { id: 16, name: "Samyang Plain", price: 110, category: "noodles", emoji: "🍜🔥" },
    { id: 17, name: "Samyang Cheesy", price: 120, category: "noodles", emoji: "🧀🍜" },
    { id: 18, name: "Cheese Slice", price: 8, category: "addons", emoji: "🧀" },
    { id: 19, name: "Egg", price: 15, category: "addons", emoji: "🥚" },
    { id: 20, name: "Cheese Sauce", price: 20, category: "addons", emoji: "🧀" },
    { id: 21, name: "Rice", price: 20, category: "addons", emoji: "🍚" },
    { id: 22, name: "C2", price: 23, category: "drinks", emoji: "🧃" },
    { id: 23, name: "Water", price: 15, category: "drinks", emoji: "💧" },
    { id: 24, name: "Coke Mismo", price: 25, category: "drinks", emoji: "🥤" },
    { id: 25, name: "Mountain Dew", price: 25, category: "drinks", emoji: "🥤" }
  ];

  let cart = [];
  let selectedCategory = 'all';
  let totalOrders = 0;
  let currentPaymentMethod = 'cash';
  let isProcessing = false;
  
  let inventoryData = menuItems.map(item => ({
    ...item,
    stock: DEFAULT_STOCK[item.id] || 0
  }));

  const menuGrid = document.getElementById('menuGrid');
  const cartList = document.getElementById('cartList');
  const cartTotalAmount = document.getElementById('cartTotalAmount');
  const cartItemCount = document.getElementById('cartItemCount');
  const cartCountHeader = document.getElementById('cartCountHeader');
  const totalHeader = document.getElementById('totalHeader');
  const orderCountDisplay = document.getElementById('orderCountDisplay');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const checkoutBtn = document.getElementById('checkoutBtn');
  const inventoryModal = document.getElementById('inventoryModal');
  const inventoryGrid = document.getElementById('inventoryGrid');
  const closeModal = document.getElementById('closeModal');
  const inventoryBtn = document.getElementById('inventoryBtn');
  const updateStockBtn = document.getElementById('updateStockBtn');
  const resetStockBtn = document.getElementById('resetStockBtn');

  function saveInventory() {
    try {
      const stockData = {};
      inventoryData.forEach(item => { stockData[item.id] = item.stock; });
      localStorage.setItem('pos_inventory', JSON.stringify(stockData));
    } catch(e) {}
  }

  function loadInventory() {
    try {
      const saved = localStorage.getItem('pos_inventory');
      if (saved) {
        const stockData = JSON.parse(saved);
        inventoryData.forEach(item => {
          if (stockData[item.id] !== undefined) item.stock = stockData[item.id];
        });
        return true;
      }
      return false;
    } catch(e) { return false; }
  }

  if (!loadInventory()) saveInventory();

  function renderMenu(category = 'all') {
    const filtered = category === 'all' ? inventoryData : inventoryData.filter(item => item.category === category);
    menuGrid.innerHTML = filtered.map(item => {
      const outOfStock = item.stock <= 0;
      const stockClass = outOfStock ? 'out-of-stock' : '';
      let stockBadgeClass = '';
      let stockLabel = `${item.stock}`;
      if (item.stock <= 0) { stockBadgeClass = 'low'; stockLabel = 'OUT'; }
      else if (item.stock <= 10) { stockBadgeClass = 'low'; }
      else if (item.stock <= 30) { stockBadgeClass = 'medium'; }
      return `<div class="menu-item ${stockClass}" data-id="${item.id}">
        <span class="stock-badge ${stockBadgeClass}">${stockLabel}</span>
        <span class="emoji-big">${item.emoji}</span>
        <div class="item-name">${item.name}</div>
        <div class="item-price">₱${item.price}</div>
        <div class="item-category-badge">${item.category}</div>
      </div>`;
    }).join('');

    document.querySelectorAll('.menu-item:not(.out-of-stock)').forEach(el => {
      el.addEventListener('click', function() {
        const id = parseInt(this.dataset.id);
        const menuItem = inventoryData.find(m => m.id === id);
        if (menuItem && menuItem.stock > 0) addToCart(menuItem);
        else if (menuItem) showToast(`⚠️ ${menuItem.name} is out of stock!`, 'warning');
      });
    });
  }

  function addToCart(item) {
    const stockItem = inventoryData.find(i => i.id === item.id);
    if (!stockItem || stockItem.stock <= 0) {
      showToast(`⚠️ ${item.name} is out of stock!`, 'warning');
      return;
    }
    const existing = cart.find(c => c.id === item.id);
    const currentQty = existing ? existing.qty : 0;
    if (currentQty >= stockItem.stock) {
      showToast(`⚠️ Not enough stock for ${item.name}. Only ${stockItem.stock} left.`, 'warning');
      return;
    }
    if (existing) existing.qty += 1;
    else cart.push({ ...item, qty: 1 });
    updateCartUI();
    showToast(`➕ ${item.name} added`, 'success');
  }

  function removeFromCart(id) {
    const index = cart.findIndex(c => c.id === id);
    if (index !== -1) {
      const removed = cart[index];
      cart.splice(index, 1);
      updateCartUI();
      showToast(`🗑️ ${removed.name} removed`, 'info');
    }
  }

  function changeQty(id, delta) {
    const item = cart.find(c => c.id === id);
    if (!item) return;
    const stockItem = inventoryData.find(i => i.id === id);
    const newQty = item.qty + delta;
    if (newQty <= 0) { removeFromCart(id); return; }
    if (newQty > stockItem.stock) {
      showToast(`⚠️ Not enough stock. Only ${stockItem.stock} left.`, 'warning');
      return;
    }
    item.qty = newQty;
    updateCartUI();
  }

  function clearCart() {
    if (cart.length === 0) { showToast('Cart is already empty', 'info'); return; }
    cart = [];
    updateCartUI();
    showToast('🧹 Cart cleared', 'info');
  }

  function getTotal() { return cart.reduce((sum, item) => sum + (item.price * item.qty), 0); }
  function getTotalItems() { return cart.reduce((sum, item) => sum + item.qty, 0); }

  function updateCartUI() {
    if (cart.length === 0) {
      cartList.innerHTML = `<div class="empty-cart-msg"><i class="fas fa-egg" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i> Your cart is empty<br><span style="font-size:0.8rem;">Add items from the menu</span></div>`;
    } else {
      cartList.innerHTML = cart.map(item => `
        <div class="cart-item" data-id="${item.id}">
          <div class="cart-item-left">
            <span class="cart-item-name">${item.emoji} ${item.name}</span>
            <div class="cart-item-meta"><span>₱${item.price}</span><span>·</span><span>${item.category}</span></div>
          </div>
          <div class="cart-item-actions">
            <button class="qty-btn" data-action="decr" data-id="${item.id}">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" data-action="incr" data-id="${item.id}">+</button>
            <button class="remove-item" data-action="remove" data-id="${item.id}"><i class="fas fa-times"></i></button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.cart-item').forEach(el => {
        const id = parseInt(el.dataset.id);
        el.querySelector('[data-action="incr"]')?.addEventListener('click', (e) => { e.stopPropagation(); changeQty(id, 1); });
        el.querySelector('[data-action="decr"]')?.addEventListener('click', (e) => { e.stopPropagation(); changeQty(id, -1); });
        el.querySelector('[data-action="remove"]')?.addEventListener('click', (e) => { e.stopPropagation(); removeFromCart(id); });
      });
    }

    const total = getTotal();
    const totalItems = getTotalItems();
    cartTotalAmount.textContent = `₱${total.toFixed(2)}`;
    cartItemCount.textContent = totalItems;
    cartCountHeader.textContent = totalItems;
    totalHeader.textContent = `₱${total.toFixed(2)}`;
  }

  async function checkout() {
    if (isProcessing) return;
    if (cart.length === 0) { showToast('⚠️ Cart is empty!', 'warning'); return; }
    
    const total = getTotal();
    const method = currentPaymentMethod.toUpperCase();
    
    let hasError = false;
    const stockUpdates = {};
    cart.forEach(cartItem => {
      const stockItem = inventoryData.find(i => i.id === cartItem.id);
      if (stockItem) {
        if (stockItem.stock >= cartItem.qty) {
          stockItem.stock -= cartItem.qty;
          stockUpdates[cartItem.id] = stockItem.stock;
        } else {
          hasError = true;
          showToast(`⚠️ Not enough stock for ${cartItem.name}`, 'warning');
        }
      }
    });

    if (hasError) {
      cart.forEach(cartItem => {
        const stockItem = inventoryData.find(i => i.id === cartItem.id);
        if (stockItem) {
          stockItem.stock += cartItem.qty;
        }
      });
      return;
    }

    saveInventory();

    const orderData = {
      orderId: 'ORD-' + Date.now().toString(36).toUpperCase(),
      paymentMethod: method,
      totalAmount: total,
      itemCount: getTotalItems(),
      items: cart.map(item => `${item.name} x${item.qty}`).join(', '),
      itemDetails: JSON.stringify(cart.map(item => ({ name: item.name, qty: item.qty, price: item.price, total: item.price * item.qty }))
